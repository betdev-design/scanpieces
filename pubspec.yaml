name: scanpieces
description: "ScanPièces - scanner de cartes, permis, passeports et documents."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_document_scanner: ^0.6.1
  image: ^4.2.0
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^11.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
