name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Trouver main.dart, le logo et la clé
        run: |
          if [ -f main.dart ]; then SRC=main.dart
          elif [ -f lib/main.dart ]; then SRC=lib/main.dart
          else SRC=$(find . -path ./.git -prune -o -type f -iname '*main.dart*' -print | head -n 1); fi
          if [ -z "$SRC" ]; then echo "main.dart introuvable"; exit 1; fi
          echo "Code utilisé : $SRC"
          cp "$SRC" /tmp/main.dart
          LOGO=$(find . -path ./.git -prune -o -type f -iname 'logo.*' -print | head -n 1)
          if [ -n "$LOGO" ]; then
            echo "Logo trouvé : $LOGO"
            python3 -c "from PIL import Image; Image.open('$LOGO').convert('RGBA').save('/tmp/logo.png')" || cp "$LOGO" /tmp/logo.png
          else
            echo "Aucun logo : icône par défaut"
          fi
          KS=$(find . -path ./.git -prune -o -type f -iname '*keystore*' -print | head -n 1)
          if [ -n "$KS" ]; then echo "Clé trouvée : $KS"; cp "$KS" /tmp/upload.p12; else echo "Aucune clé"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android
        run: |
          flutter create --org com.nigbou --project-name scanpieces --platforms android app
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          mkdir -p app/lib
          cp /tmp/main.dart app/lib/main.dart
          sed -i 's/android:label="scanpieces"/android:label="ScanPièces"/' app/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import os
          p = 'app/android/app/build.gradle.kts'
          s = open(p).read()
          old = 'signingConfig = signingConfigs.getByName("debug")'
          if old not in s:
              raise SystemExit('Ligne de signature introuvable dans build.gradle.kts')
          if os.environ.get('KS_PASSWORD') and os.path.exists('/tmp/upload.p12'):
              new = '''signingConfig = signingConfigs.create("upload") {
                          storeFile = file("/tmp/upload.p12")
                          storeType = "pkcs12"
                          storePassword = System.getenv("KS_PASSWORD")
                          keyAlias = "upload"
                          keyPassword = System.getenv("KS_PASSWORD")
                      }'''
              print('Signature : clé ScanPièces (publiable sur le Play Store)')
          else:
              new = old
              print('Signature : clé de test (AAB non publiable)')
          new += '\n            isMinifyEnabled = false\n            isShrinkResources = false'
          open(p, 'w').write(s.replace(old, new))
          PY

      - name: Installer les dépendances
        working-directory: app
        run: flutter pub get

      - name: Icône de l'application
        working-directory: app
        run: |
          if [ ! -f /tmp/logo.png ]; then echo "Pas de logo"; exit 0; fi
          cp /tmp/logo.png logo.png
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "logo.png"\n  min_sdk_android: 21\n' > flutter_launcher_icons.yaml
          flutter pub add dev:flutter_launcher_icons
          dart run flutter_launcher_icons

      - name: Compiler l'APK
        working-directory: app
        run: flutter build apk --release

      - name: Compiler l'AAB (Play Store)
        working-directory: app
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: ScanPieces-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanPieces-PlayStore-AAB
          path: app/build/app/outputs/bundle/release/app-release.aab
